<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docking Trainer 3D — First Playable</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="dock3d">
 <div class="viz-row"><strong>Docking Trainer · 31′ cruiser</strong><span id="readout" class="tabular-nums">0.0 kt</span></div>
 <canvas aria-label="Interactive 3D boat and finger dock" style="width:100%;height:440px;display:block;touch-action:none"></canvas>
 <div class="viz-controls"><span class="text-small">Drag scene to look around · release to return</span><label class="form-label">Start <select class="form-select" id="spawn"><option value="approach">Open approach</option><option value="port">Alongside port dock</option><option value="stbd">Alongside starboard dock</option></select></label><button class="btn" id="reset">Reset boat</button><button class="btn" id="stop">Both neutral</button></div>
 <div class="engine-controls" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
  <div><div class="text-small">PORT · <span id="pv">N</span></div><div style="display:grid;gap:6px;margin-top:6px">
   <button type="button" class="btn engine-button" data-engine="port" data-power="25" aria-pressed="false" aria-label="Port 25 percent ahead, hold for power">25 FWD</button>
   <button type="button" class="btn engine-button" data-engine="port" data-power="10" aria-pressed="false" aria-label="Port 10 percent ahead, hold for power">10 FWD</button>
   <button type="button" class="btn engine-button" data-engine="port" data-power="-10" aria-pressed="false" aria-label="Port 10 percent reverse, hold for power">10 REV</button>
   <button type="button" class="btn engine-button" data-engine="port" data-power="-25" aria-pressed="false" aria-label="Port 25 percent reverse, hold for power">25 REV</button>
  </div></div>
  <div><div class="text-small">BOTH · <span id="bv">N</span></div><div style="display:grid;gap:6px;margin-top:6px">
   <button type="button" class="btn engine-button" data-engine="both" data-power="25" aria-pressed="false" aria-label="Both 25 percent ahead, hold for power">25 FWD</button>
   <button type="button" class="btn engine-button" data-engine="both" data-power="10" aria-pressed="false" aria-label="Both 10 percent ahead, hold for power">10 FWD</button>
   <button type="button" class="btn engine-button" data-engine="both" data-power="-10" aria-pressed="false" aria-label="Both 10 percent reverse, hold for power">10 REV</button>
   <button type="button" class="btn engine-button" data-engine="both" data-power="-25" aria-pressed="false" aria-label="Both 25 percent reverse, hold for power">25 REV</button>
  </div></div>
  <div><div class="text-small">STARBOARD · <span id="sv">N</span></div><div style="display:grid;gap:6px;margin-top:6px">
   <button type="button" class="btn engine-button" data-engine="stbd" data-power="25" aria-pressed="false" aria-label="Starboard 25 percent ahead, hold for power">25 FWD</button>
   <button type="button" class="btn engine-button" data-engine="stbd" data-power="10" aria-pressed="false" aria-label="Starboard 10 percent ahead, hold for power">10 FWD</button>
   <button type="button" class="btn engine-button" data-engine="stbd" data-power="-10" aria-pressed="false" aria-label="Starboard 10 percent reverse, hold for power">10 REV</button>
   <button type="button" class="btn engine-button" data-engine="stbd" data-power="-25" aria-pressed="false" aria-label="Starboard 25 percent reverse, hold for power">25 REV</button>
  </div></div>
 </div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
  <label class="form-label">Steering <span id="av">0°</span><input class="form-range" id="steer" type="range" min="-35" max="35" value="0"><span class="viz-controls" style="margin-top:6px"><button type="button" class="btn" data-steer="-35">Full port</button><button type="button" class="btn" data-steer="0">Centre</button><button type="button" class="btn" data-steer="35">Full starboard</button></span></label>
  <label class="form-label">Crosswind <span id="wv">0 kt</span><input class="form-range" id="wind" type="range" min="0" max="20" value="0"></label>
 </div>
 <div class="viz-controls" style="margin-top:10px"><button class="btn" id="line-bow" aria-pressed="false">Bow</button><button class="btn" id="line-fwdSpring" aria-pressed="false">Forward spring</button><button class="btn" id="line-aftSpring" aria-pressed="false">Aft spring</button><button class="btn" id="line-stern" aria-pressed="false">Stern</button><button class="btn" id="release">Release all lines</button></div>
 <div class="viz-controls" style="margin-top:8px"><button class="btn" id="fender-port" aria-pressed="false">Port fenders</button><button class="btn" id="fender-stbd" aria-pressed="false">Starboard fenders</button></div>
 <div id="line-status" class="text-small" style="margin-top:8px">No lines attached</div>
 <div id="contact" class="text-small" aria-live="polite">Loading 3D scene…</div>
</div>
<script type="module" src="src/main.js?v=look-4"></script></body></html>
