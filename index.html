<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docking Trainer 3D</title><link rel="stylesheet" href="styles.css?v=overlay-6"></head><body>
<main id="dock3d">
 <header class="viz-row"><strong>Docking Trainer · 31′ cruiser</strong><span id="readout" class="tabular-nums">0.0 kt</span></header>
 <div class="scene-frame">
  <canvas id="game-canvas" aria-label="3D marina; drag to look around"></canvas>
  <div class="view-tools"><button type="button" class="scene-button" id="view">View · Medium</button><button type="button" class="scene-button" id="recenter" aria-label="Return camera behind boat">Recenter</button></div>
  <button type="button" class="map-panel" id="map-toggle" aria-label="Mini-map, north up; click to expand" aria-expanded="false"><span>MARINA <b>N ↑</b></span><canvas id="mini-map" width="220" height="220" aria-label="Marina map showing boat position and heading"></canvas></button>
  <div class="line-rail port"><strong>PORT</strong><button type="button" class="scene-button line-button" id="line-port-bow" data-side="port" data-line="bow" aria-pressed="false" aria-label="PORT Bow line"><span>Bow</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-port-fwdSpring" data-side="port" data-line="fwdSpring" aria-pressed="false" aria-label="PORT Fwd spring line"><span>Fwd spring</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-port-aftSpring" data-side="port" data-line="aftSpring" aria-pressed="false" aria-label="PORT Aft spring line"><span>Aft spring</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-port-stern" data-side="port" data-line="stern" aria-pressed="false" aria-label="PORT Stern line"><span>Stern</span><small>Released</small></button><button type="button" class="scene-button" id="fender-port" aria-pressed="false">Fenders<small>Stowed</small></button></div><div class="line-rail stbd"><strong>STBD</strong><button type="button" class="scene-button line-button" id="line-stbd-bow" data-side="stbd" data-line="bow" aria-pressed="false" aria-label="STBD Bow line"><span>Bow</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-stbd-fwdSpring" data-side="stbd" data-line="fwdSpring" aria-pressed="false" aria-label="STBD Fwd spring line"><span>Fwd spring</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-stbd-aftSpring" data-side="stbd" data-line="aftSpring" aria-pressed="false" aria-label="STBD Aft spring line"><span>Aft spring</span><small>Released</small></button><button type="button" class="scene-button line-button" id="line-stbd-stern" data-side="stbd" data-line="stern" aria-pressed="false" aria-label="STBD Stern line"><span>Stern</span><small>Released</small></button><button type="button" class="scene-button" id="fender-stbd" aria-pressed="false">Fenders<small>Stowed</small></button></div>
  <div class="scene-hint">Drag to look · release to return</div>
 </div>
 <div class="status-bar"><span id="contact" role="status" aria-live="polite">Loading 3D scene…</span><button class="btn small-button" id="release">Release all lines</button></div>
 <div id="line-status" class="text-small">No lines attached</div>
 <section class="helm-panel">
  <div class="control-card"><h2>Engines · hold for power</h2><div class="engine-controls"><div class="engine-column"><div class="column-title">PORT <span id="pv">N</span></div><button type="button" class="btn engine-button" data-engine="port" data-power="25" aria-pressed="false" aria-label="PORT 25 percent ahead, hold for power">25 FWD</button><button type="button" class="btn engine-button" data-engine="port" data-power="10" aria-pressed="false" aria-label="PORT 10 percent ahead, hold for power">10 FWD</button><button type="button" class="btn engine-button" data-engine="port" data-power="-10" aria-pressed="false" aria-label="PORT 10 percent reverse, hold for power">10 REV</button><button type="button" class="btn engine-button" data-engine="port" data-power="-25" aria-pressed="false" aria-label="PORT 25 percent reverse, hold for power">25 REV</button></div><div class="engine-column"><div class="column-title">BOTH <span id="bv">N</span></div><button type="button" class="btn engine-button" data-engine="both" data-power="25" aria-pressed="false" aria-label="BOTH 25 percent ahead, hold for power">25 FWD</button><button type="button" class="btn engine-button" data-engine="both" data-power="10" aria-pressed="false" aria-label="BOTH 10 percent ahead, hold for power">10 FWD</button><button type="button" class="btn engine-button" data-engine="both" data-power="-10" aria-pressed="false" aria-label="BOTH 10 percent reverse, hold for power">10 REV</button><button type="button" class="btn engine-button" data-engine="both" data-power="-25" aria-pressed="false" aria-label="BOTH 25 percent reverse, hold for power">25 REV</button></div><div class="engine-column"><div class="column-title">STBD <span id="sv">N</span></div><button type="button" class="btn engine-button" data-engine="stbd" data-power="25" aria-pressed="false" aria-label="STBD 25 percent ahead, hold for power">25 FWD</button><button type="button" class="btn engine-button" data-engine="stbd" data-power="10" aria-pressed="false" aria-label="STBD 10 percent ahead, hold for power">10 FWD</button><button type="button" class="btn engine-button" data-engine="stbd" data-power="-10" aria-pressed="false" aria-label="STBD 10 percent reverse, hold for power">10 REV</button><button type="button" class="btn engine-button" data-engine="stbd" data-power="-25" aria-pressed="false" aria-label="STBD 25 percent reverse, hold for power">25 REV</button></div></div><button class="btn neutral-button" id="stop">Both neutral</button></div>
  <div class="right-controls"><div class="control-card"><h2>Steering <span id="av">0°</span></h2><input class="form-range" id="steer" aria-label="Steering angle" type="range" min="-35" max="35" value="0"><div class="steer-buttons"><button class="btn" data-steer="-35">Port</button><button class="btn" data-steer="0">Centre</button><button class="btn" data-steer="35">Starboard</button></div></div>
   <div class="control-card"><label for="catchup">Camera catch-up <strong id="cv">8 s</strong></label><input class="form-range" id="catchup" type="range" min="0" max="16" step="0.5" value="8"><div class="text-small" id="catchup-note">Far / Medium follow delay · 0 = immediate</div></div>
  </div>
 </section>
 <div class="start-bar"><label>Start <select class="form-select" id="spawn"></select></label><button class="btn" id="reset">Reset boat</button></div>
 <details class="control-card setup"><summary>Wind &amp; environment</summary><div class="settings-grid"><label>Wind speed <strong id="wv">0 kt</strong><input class="form-range" id="wind" type="range" min="0" max="20" value="0"></label><label>Wind blows toward <strong id="dv">E · 90°</strong><input class="form-range" id="wind-direction" type="range" min="0" max="355" step="5" value="90"></label></div><div class="text-small" id="wind-arrow">Wind → E · waves travel downwind</div></details>
</main><script type="module" src="src/main.js?v=overlay-6"></script></body></html>
